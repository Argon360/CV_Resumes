<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CVs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Fallback */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .hub-container {
            background: rgba(30, 41, 59, 0.4);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #38bdf8;
            letter-spacing: -0.025em;
            transform: translateZ(20px);
        }
        ul {
            list-style: none;
            padding: 0;
            transform: translateZ(30px);
        }
        li {
            margin-bottom: 1rem;
        }
        a {
            display: block;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            text-decoration: none;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        a:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="hub-container" id="card">
        <h1>Professional Profiles</h1>
        <ul>
            <li style="margin-bottom: 0.5rem; color: #38bdf8; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Recruiter Ready (ATS Optimized)</li>
            <li><a href="Dhiraj_Patil_NetworkEng.html" target="_blank">Network Engineering (Professional)</a></li>
            <li><a href="Dhiraj_Patil_CyberSecurity.html" target="_blank">Cybersecurity (Professional)</a></li>
            
            <li style="margin-top: 1.5rem; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Creative Versions</li>
            <li><a href="Dhiraj_Patil_NetworkEng_CV_Professional.html" target="_blank">Network Dashboard (Cisco IOS)</a></li>
            <li><a href="Dhiraj_Patil_CyberSec_CV_Hacker.html" target="_blank">Hacker Mode (Terminal)</a></li>
        </ul>
    </div>

    <script>
        // --- 3D Tilt Effect ---
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- Starfield Animation ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        const stars = [];
        const numStars = 200;
        const speed = 2;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * width; 
            }
            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.z = width;
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }
            }
            draw() {
                const x = (this.x - width / 2) * (width / this.z) + width / 2;
                const y = (this.y - height / 2) * (width / this.z) + height / 2;
                const radius = width / this.z; // Size based on distance

                ctx.beginPath();
                ctx.fillStyle = "white";
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < numStars; i++) stars.push(new Star());

        function animate() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, width, height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
